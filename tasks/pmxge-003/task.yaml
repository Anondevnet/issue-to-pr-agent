title: Engagement-bait penalty never fires for posts ending in 'Thoughts?'
body: |
  `score_reply_potential` has `thoughts?$` and `agree?$` in the engagement-bait list, but a draft ending with "Thoughts?" never gets the -30 `engagement_bait` penalty.

  Repro:
  ```python
  score_reply_potential("The election odds moved 12% overnight on thin liquidity. Thoughts?").breakdown
  # no 'engagement_bait' key
  ```
  Expected `breakdown["engagement_bait"] == -30.0` and the "reads as engagement bait" warning.
import_roots: .
difficulty: easy
category: regex
source: real
