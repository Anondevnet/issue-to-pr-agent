title: validate_concept_dict accepts beats that aren't a list
body: |
  If the planner/LLM returns `"beats": "intro, middle, end"` (a string), `validate_concept_dict` returns no errors, and the pipeline crashes later when it iterates beats as dicts.

  Expected: a non-list `beats` value produces a validation error (e.g. `"beats must be a list"`). Lists with fewer than 3 beats keep the existing `"need >= 3 beats"` error.
import_roots: src
difficulty: easy
category: validation
source: real
