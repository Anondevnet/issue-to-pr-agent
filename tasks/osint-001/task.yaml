title: Unicode digits in ?limit= crash the API proxy with a 500
body: |
  `normalize_query` validates `limit`/`offset` with `str.isdigit()`, which is true for characters like `²` (superscript two). `int("²")` then raises `ValueError`, which escapes as a 500 instead of the friendly 400.

  Repro: `normalize_query("limit=%C2%B2")` raises ValueError.

  Expected: a `DashboardError` with status 400 ("Limit and offset must be whole numbers.") for any non-ASCII digits. Normal values like `limit=50` keep working.
