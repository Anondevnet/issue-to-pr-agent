title: Quoted front-matter values keep their quotes
body: |
  Front matter values written YAML-style with quotes, e.g.

  ```
  ---
  title: "Reentrancy: basics"
  ---
  ```

  come out of `parse_front_matter` as `'"Reentrancy: basics"'`, so search results show the title wrapped in quotes. (Quoting is needed when a value contains a colon.)

  Expected: matching surrounding single or double quotes are removed. Unquoted values, and values that only contain quotes inside, are unchanged.
import_roots: src
difficulty: easy
category: parsing
source: real
