title: reply_fetcher._parse_ts returns naive datetimes for timestamps without an offset
body: |
  `_parse_ts` in `pmxge/monitoring/reply_fetcher.py` returns an aware UTC datetime for `...Z` strings and for its fallback, but a timestamp without an offset (`"2026-11-22T10:00:00"`) comes back naive. Comparing it with the other aware timestamps then raises `TypeError: can't compare offset-naive and offset-aware datetimes`.

  Expected: timestamps without an offset are treated as UTC, so the result is always timezone-aware.
import_roots: .
difficulty: easy
category: datetime
source: real
