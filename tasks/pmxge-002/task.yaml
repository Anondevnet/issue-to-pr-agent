title: Bare domains like polymarket.com/event/... slip past the no-links rule
body: |
  The validator is supposed to block links in the main post body ("links belong in the first reply"), but it only catches `http(s)://` and `www.`. A draft that says `full breakdown at polymarket.com/event/fed-cut` passes validation, and X still renders that as a link.

  Please also reject bare domains (at least common TLDs like .com, .io, .xyz, .org, .net, .ai, .co, .app, .dev) in the body. Ordinary text with decimals like `0.62` or `12.5%` must not be flagged.
import_roots: .
